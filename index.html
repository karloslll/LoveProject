<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ واجب اليوم ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h3 class="date">
        📅 تاريخ أداء الواجب<br>
        26 / 07 / 2026
    </h3>

    <!-- السؤال الأول -->

    <div id="question1">

        <h1>
            واش كنتسالها جوج بوسات ❤️<br>
            وجوج تعنيقات؟ 🤗
        </h1>

        <div class="buttons">

            <button id="yesBtn">
                إيه 😍
            </button>

            <button id="noBtn">
                لا 🙈
            </button>

        </div>

    </div>


    <!-- السؤال الثاني -->

    <div id="question2" class="hidden">

        <h1>
            نبداو بالأول شنو؟ 😏
        </h1>

        <div class="buttons">

            <button id="hugBtn">
                🤗 تعنيقة
            </button>

            <button id="kissBtn">
                😘 بوسة
            </button>

        </div>

    </div>


    <!-- النتيجة -->

    <div id="result" class="hidden">

        <h1 id="resultText"></h1>

        <button onclick="location.reload()">
            🔄 عاود اللعبة
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
